version = 1

test_patterns = [
  "**/tests/**/*.test.ts",
]

exclude_patterns = [
  "**/node_modules/**",
  "**/dist/**",
  "**/build/**",
  "**/coverage/**",
  "**/tests/capability.compile.ts",
  "**/tests/crypto-lint-fixtures/**",
  "**/tests/lint-fixtures/**",
  "**/tests/mutant-fixtures/**",
]

[[analyzers]]
name = "javascript"
enabled = true

  [analyzers.meta]
  module_system = "es-modules"
  environment = ["nodejs", "vitest"]

[[analyzers]]
name = "secrets"
enabled = true
