name: Publish

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  publish-release:
    if: github.event_name == 'release'
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - run: npm install -g npm@11.17.0 --registry=https://registry.npmjs.org/
      - run: npm ci --registry=https://registry.npmjs.org/

      - name: Verify trusted publication contract
        run: npm run publish:guard

      - name: Resolve release source commit
        id: source_commit
        run: |
          set -euo pipefail
          commit="$(node scripts/resolve-source-commit.mjs)"
          if [ -z "${commit}" ]; then
            echo "resolve-source-commit: produced no commit" >&2
            exit 1
          fi
          echo "source_commit=${commit}" >> "${GITHUB_OUTPUT}"

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          SIGIL_SOURCE_COMMIT: ${{ steps.source_commit.outputs.source_commit }}

      - name: Prepare exact release artifact
        id: release
        env:
          RELEASE_MANIFEST_PATH: ${{ runner.temp }}/sigil-agent-hooks-release.json
        run: node scripts/prepare-publish.mjs

      - name: Publish immutable release with provenance
        if: steps.release.outputs.publish_required == 'true'
        run: npm publish "${{ steps.release.outputs.tarball }}" --access public --provenance --tag latest

      - name: Verify exact registry release
        env:
          RELEASE_MANIFEST_PATH: ${{ steps.release.outputs.manifest }}
        run: node scripts/verify-published-release.mjs
