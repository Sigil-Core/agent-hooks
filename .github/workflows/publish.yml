name: Publish

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  stage-publish:
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: npm-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org/

      - run: npm install -g npm@11.17.0

      - name: Resolve staged source commit
        id: source_commit
        run: |
          set -euo pipefail
          commit="$(node scripts/resolve-source-commit.mjs)"
          if [ -z "${commit}" ]; then
            echo "resolve-source-commit: produced no commit" >&2
            exit 1
          fi
          echo "source_commit=${commit}" >> "${GITHUB_OUTPUT}"

      - run: npm ci

      - name: Verify trusted publication contract
        run: npm run publish:guard

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          SIGIL_SOURCE_COMMIT: ${{ steps.source_commit.outputs.source_commit }}

      - name: Stage reviewed package under the Phase 6 tag
        run: npm stage publish --access public --provenance --tag fleet-phase6

  publish:
    if: github.event_name == 'release'
    environment:
      name: npm-production
    runs-on: ubuntu-latest
    steps:
      # Full history and every tag, so the release commit can be peeled and
      # proven to be an ancestor of origin/main. A shallow checkout would leave
      # the ancestry check unable to resolve origin/main, and the resolver fails
      # closed on that rather than publishing anyway.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org/

      - run: npm install -g npm@11.17.0

      # Resolves the commit that the published artifact will report on
      # X-Sigil-Client: peels annotated tags to their commit, requires that
      # commit to be an ancestor of origin/main, and fails closed otherwise.
      # Works for both a tag ref (the release event) and a branch ref (manual
      # dispatch). The annotated tag object SHA is never emitted.
      - name: Resolve published source commit
        id: source_commit
        run: |
          set -euo pipefail
          commit="$(node scripts/resolve-source-commit.mjs)"
          if [ -z "${commit}" ]; then
            echo "resolve-source-commit: produced no commit" >&2
            exit 1
          fi
          echo "source_commit=${commit}" >> "${GITHUB_OUTPUT}"

      - run: npm ci

      - name: Verify trusted publication contract
        run: npm run publish:guard

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          SIGIL_SOURCE_COMMIT: ${{ steps.source_commit.outputs.source_commit }}

      - name: Skip already published version
        id: published
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          published_version="$(npm view "${package_name}@${package_version}" version 2>/dev/null || true)"

          if [ "${published_version}" = "${package_version}" ]; then
            echo "already_published=true" >> "${GITHUB_OUTPUT}"
            echo "${package_name}@${package_version} is already published."
          else
            echo "already_published=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish to npm
        if: steps.published.outputs.already_published != 'true'
        run: npm publish --access public --provenance
