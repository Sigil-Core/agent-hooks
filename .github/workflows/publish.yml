name: Publish

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-publish:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org/

      - run: npm install -g npm@11.17.0 --registry=https://registry.npmjs.org/

      - name: Resolve staged source commit
        id: source_commit
        run: |
          set -euo pipefail
          commit="$(node scripts/resolve-source-commit.mjs)"
          if [ -z "${commit}" ]; then
            echo "resolve-source-commit: produced no commit" >&2
            exit 1
          fi
          echo "source_commit=${commit}" >> "${GITHUB_OUTPUT}"

      - run: npm ci --registry=https://registry.npmjs.org/

      - name: Verify trusted publication contract
        run: npm run publish:guard

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          SIGIL_SOURCE_COMMIT: ${{ steps.source_commit.outputs.source_commit }}

      - name: Stage reviewed package under the Phase 6 tag
        run: npm stage publish --access public --provenance --tag fleet-phase6

  verify-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      # Full history and every tag, so the release commit can be peeled and
      # proven to be an ancestor of origin/main. A shallow checkout would leave
      # the ancestry check unable to resolve origin/main, and the resolver fails
      # closed on that rather than publishing anyway.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.14.0

      - run: npm install -g npm@11.17.0 --registry=https://registry.npmjs.org/

      - run: npm ci --registry=https://registry.npmjs.org/

      - name: Verify trusted publication contract
        run: npm run publish:guard

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Require the approved staged package
        run: node scripts/verify-published-release.mjs
