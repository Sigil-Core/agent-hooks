name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - session/**

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run publish:guard
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run decision:gate:blocking
      - run: npm run decision:gate:capability
      - run: npm run decision:gate:imports
      - run: npm run decision:batch
      - run: npm test
      - run: npm run build
