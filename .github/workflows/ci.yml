name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - session/**

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run publish:guard
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run decision:gate:blocking
      - run: npm run decision:gate:capability
      - run: npm run decision:gate:imports
      - run: npm run decision:batch
      - run: npm test
      - run: npm run build
